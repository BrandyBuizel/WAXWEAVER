name: "godot-ci export"
on: push

env:
  GODOT_VERSION: 4.7
  EXPORT_NAME: WAXWEAVER
  PROJECT_PATH: theSandbox

jobs:
  export-windows:
    name: Windows Export
    runs-on: ubuntu-24.04  # Use 24.04 with godot 4
    container:
      image: barichello/godot-ci:4.7
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Import project
        run: godot --headless --editor --path "$PROJECT_PATH" --quit
      - name: Windows Build
        run: |
          mkdir -v -p builds/windows
          EXPORT_DIR="$(readlink -f builds)"
          cd $PROJECT_PATH
          godot --headless --verbose --export-release "Windows Desktop" "$EXPORT_DIR/windows/$EXPORT_NAME.exe"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: builds/windows

  export-linux:
    name: Linux Export (${{ matrix.architecture }})
    runs-on: ubuntu-24.04  # Use 24.04 with godot 4
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            preset: Linux
          - architecture: arm64
            preset: Linux ARM64
    container:
      image: barichello/godot-ci:4.7
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Install Linux build tools
        run: apt-get update && apt-get install -y build-essential scons g++-aarch64-linux-gnu
      - name: Build Linux extension
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          if [ "$ARCHITECTURE" = "arm64" ]; then
            export LINUX_CC=aarch64-linux-gnu-gcc
            export LINUX_CXX=aarch64-linux-gnu-g++
          fi
          scons platform=linux target=template_release arch="$ARCHITECTURE" \
            custom_api_file=godot-cpp/gdextension/extension_api.json
          EXTENSION="theSandbox/bin/libgdexample.linux.template_release.${ARCHITECTURE}.so"
          test -f "$EXTENSION"
          case "$ARCHITECTURE" in
            arm64) readelf -h "$EXTENSION" | grep -Eq 'Machine:.*AArch64' ;;
            x86_64) readelf -h "$EXTENSION" | grep -Eq 'Machine:.*X86-64' ;;
          esac
      - name: Import project
        run: godot --headless --editor --path "$PROJECT_PATH" --quit
      - name: Linux Build
        run: |
          mkdir -v -p "builds/linux/${{ matrix.architecture }}"
          EXPORT_DIR="$(readlink -f builds)"
          cd $PROJECT_PATH
          godot --headless --verbose --export-release "${{ matrix.preset }}" "$EXPORT_DIR/linux/${{ matrix.architecture }}/$EXPORT_NAME.${{ matrix.architecture }}"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.architecture }}
          path: builds/linux/${{ matrix.architecture }}

  export-web:
    name: Web Export
    runs-on: ubuntu-24.04  # Use 24.04 with godot 4
    container:
      image: barichello/godot-ci:4.7
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Import project
        run: godot --headless --editor --path "$PROJECT_PATH" --quit
      - name: Web Build
        run: |
          mkdir -v -p builds/web
          EXPORT_DIR="$(readlink -f builds)"
          cd $PROJECT_PATH
          godot --headless --verbose --export-release "Web" "$EXPORT_DIR/web/index.html"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: builds/web
      - name: Install rsync 📚
        run: |
          apt-get update && apt-get install -y rsync
      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@releases/v4
        with:
          branch: builds # The branch the action should deploy to.
          folder: builds/web # The folder the action should deploy.

  export-mac:
    name: Mac Export
    runs-on: ubuntu-24.04  # Use 24.04 with godot 4
    container:
      image: barichello/godot-ci:4.7
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Import project
        run: godot --headless --editor --path "$PROJECT_PATH" --quit
      - name: Mac Build
        run: |
          mkdir -v -p builds/mac
          EXPORT_DIR="$(readlink -f builds)"
          cd $PROJECT_PATH
          godot --headless --verbose --export-release "macOS" "$EXPORT_DIR/mac/$EXPORT_NAME.zip"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: builds/mac
